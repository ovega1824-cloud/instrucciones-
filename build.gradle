plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '2.5.0'
group = 'com.ciber.instrucciones'

base {
    archivesName = 'instrucciones'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// El jar final se genera uniendo este jar (codigo nuevo) con las clases originales
// del mod (carpeta "original") mediante tools/merge_jar.py en el workflow de GitHub.
jar.finalizedBy('reobfJar')
